[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshield-local"
version = "0.1.0"
description = "Local review-first redaction of secrets, PII, faces and QR codes in screenshots"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alexander"}]
dependencies = ["pillow>=11,<13", "pydantic>=2.10,<3"]

[project.optional-dependencies]
ocr = ["paddleocr>=3.4,<3.5", "paddlepaddle>=3.3,<3.4"]
pii = [
  "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3",
  "spacy>=3.7.2,<3.8",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl#sha256=86cc141f63942d4b2c5fcee06630fd6f904788d2f0ab005cce45aadb8fb73889",
]
vision = ["numpy>=1.26,<2", "opencv-contrib-python==4.10.0.84"]
app = ["streamlit>=1.45,<2"]
demo = ["qrcode[pil]>=8.2,<9"]
dev = ["numpy>=1.26,<2", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
all = [
  "paddleocr>=3.4,<3.5", "paddlepaddle>=3.3,<3.4",
  "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "spacy>=3.7.2,<3.8",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl#sha256=86cc141f63942d4b2c5fcee06630fd6f904788d2f0ab005cce45aadb8fb73889",
  "numpy>=1.26,<2", "opencv-contrib-python==4.10.0.84", "streamlit>=1.45,<2", "qrcode[pil]>=8.2,<9",
]

[project.scripts]
screenshield = "screenshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: runs local OCR, NLP, or vision models"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["screenshield"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
