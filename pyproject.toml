[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshield-local"
version = "0.1.0"
description = "Local review-first redaction of secrets, PII, faces and QR codes in screenshots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alexander"}]
dependencies = ["pillow>=11,<13", "pydantic>=2.10,<3"]

[project.optional-dependencies]
ocr = ["paddleocr>=3.3,<4", "paddlepaddle>=3.2,<4"]
pii = ["presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "spacy>=3.8,<4"]
vision = ["opencv-python-headless>=4.11,<5"]
app = ["streamlit>=1.45,<2"]
demo = ["qrcode[pil]>=8.2,<9"]
dev = ["numpy>=2,<3", "pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
all = [
  "paddleocr>=3.3,<4", "paddlepaddle>=3.2,<4",
  "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3", "spacy>=3.8,<4",
  "opencv-python-headless>=4.11,<5", "streamlit>=1.45,<2", "qrcode[pil]>=8.2,<9",
]

[project.scripts]
screenshield = "screenshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["screenshield"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
