name: Model integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-model-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_MODEL_INTEGRATION: "1"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      DO_NOT_TRACK: "1"
      SCREENSHIELD_FACE_FIXTURE: "${{ github.workspace }}/largest_selfie.jpg"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev --extra demo --extra ocr --extra pii --extra vision
      - run: uv run screenshield install-models
      - name: Download licensed OpenCV Zoo face fixture
        run: >-
          curl --fail --location --output largest_selfie.jpg
          https://raw.githubusercontent.com/opencv/opencv_zoo/47534e27c9851bb1128ccc0102f1145e27f23f98/models/face_detection_yunet/example_outputs/largest_selfie.jpg
      - name: Verify face fixture
        run: echo "ab8413ad9bb4f53068f4fb63c6747e5989991dd02241c923d5595b614ecf2bf6  largest_selfie.jpg" | sha256sum --check
      - run: uv run pytest -m integration
